name: Nobitex Market Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "paper_state_v4.json"

permissions:
  contents: write

concurrency:
  group: nobitex-paper-bot
  cancel-in-progress: false

jobs:
  market-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Nobitex Market Bot
        run: python bot.py

      - name: Save paper trading state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state_v4.json

          if git diff --cached --quiet; then
            echo "تغییری برای ذخیره وجود ندارد."
            exit 0
          fi

          git commit -m "Update paper trading state"

          git fetch origin main

          if ! git rebase origin/main; then
            echo "خطا در هماهنگ‌سازی تغییرات؛ از بازنویسی سوابق جلوگیری شد."
            git rebase --abort || true
            exit 1
          fi

          git push origin HEAD:main
