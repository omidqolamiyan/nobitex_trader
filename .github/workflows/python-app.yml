name: Nobitex Market Bot

on:
workflow_dispatch:
push:
branches: ["main"]

permissions:
contents: read

jobs:
market-check:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Run Nobitex market bot
    run: python -u bot.py
