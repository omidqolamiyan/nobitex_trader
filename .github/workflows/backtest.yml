name: Backtest Trading Strategies
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical backtest
        run: python -u backtest.py
