name: Backtest V4.2 Walk Forward

on:
  workflow_dispatch:
  schedule:
    # Weekly research run; deliberately not every 5 minutes to avoid needless API load.
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: backtest-v4-2
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run V4.2 self-tests and walk-forward backtest
        run: python -u backtest_v4_2.py

      - name: Upload V4.2 report
        if: always() && hashFiles('backtest_v4_2_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v4-2-report
          path: backtest_v4_2_report.json
          if-no-files-found: error
          retention-days: 30
